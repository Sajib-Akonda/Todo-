<!doctype html>
<html lang="en">
  <head>
    <title>Todo List</title>
    <link rel="stylesheet" href="todo.css" />
  </head>
  <body>
    <div class="todo-list">
      <p class="todo-text">Todo List</p>
    </div>
    <div class="todo-input-grid">
      <input type="text" placeholder="Add todo" class="js-todo todo-input" />
      <input type="date" class="js-due-date-input due-date" />
      <button class="add-button js-add-todo-button">Add</button>
    </div>

    <div class="js-todo-list todo-grid"></div>
    <script src="todo.js"></script>
  </body>
</html>
